<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Inicial - Jellyfin-refina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-[#0b0f19] text-gray-100 flex flex-col min-h-screen justify-between">

  <div></div>

  <div class="max-w-md w-full mx-auto px-4 py-8">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-cyan-400 mx-auto flex items-center justify-center shadow-xl shadow-indigo-500/25 mb-4">
        <i class="fas fa-play text-white text-2xl ml-1"></i>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white via-gray-100 to-indigo-300 bg-clip-text text-transparent">
        Jellyfin-refina
      </h1>
      <p class="text-sm text-indigo-400 mt-1 font-medium">
        Assistente de Instalação &amp; Setup Inicial
      </p>
      <p class="text-xs text-gray-400 mt-2">
        Nenhum usuário detectado. Cadastre o administrador para começar.
      </p>
    </div>

    <div class="bg-[#161e2e] border border-gray-800 rounded-2xl p-8 shadow-2xl shadow-black/50">
      {% if error %}
      <div class="mb-6 p-4 rounded-xl bg-red-950/60 border border-red-800/80 text-red-200 text-sm flex items-start space-x-3">
        <i class="fas fa-circle-exclamation text-red-400 mt-0.5 text-base"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/setup" method="POST" class="space-y-5">
        <div>
          <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-2">
            Nome do Usuário Administrador
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
              <i class="fas fa-user"></i>
            </span>
            <input type="text" id="username" name="username" required autocomplete="username"
              class="w-full pl-10 pr-4 py-3 bg-[#0d121f] border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition"
              placeholder="Ex: admin">
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-2">
            Senha Forte
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
              <i class="fas fa-lock"></i>
            </span>
            <input type="password" id="password" name="password" required autocomplete="new-password"
              class="w-full pl-10 pr-4 py-3 bg-[#0d121f] border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition"
              placeholder="Mínimo de 6 caracteres">
          </div>
        </div>

        <div>
          <label for="confirm_password" class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-2">
            Confirme a Senha
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
              <i class="fas fa-check-double"></i>
            </span>
            <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password"
              class="w-full pl-10 pr-4 py-3 bg-[#0d121f] border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition"
              placeholder="Digite a mesma senha">
          </div>
        </div>

        <button type="submit"
          class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-150 flex items-center justify-center space-x-2 text-sm mt-2">
          <span>Criar Administrador e Iniciar</span>
          <i class="fas fa-arrow-right text-xs"></i>
        </button>
      </form>
    </div>
  </div>

  <footer class="py-6 border-t border-gray-800/80 text-center text-xs text-gray-400">
    Desenvolvido por Nelson Cherubim de Andrade
  </footer>

</body>
</html>
